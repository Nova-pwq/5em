<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5em</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-secondary-bg-color,#efeff4);--card:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#000);--hint:var(--tg-theme-hint-color,#8e8e93);--link:var(--tg-theme-link-color,#2481cc);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--red:var(--tg-theme-destructive-text-color,#e53935);--sep:rgba(128,128,128,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px 0 40px}
.hdr{text-align:center;padding:18px 16px 8px}
.ava{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#5ec0f7,#2481cc);color:#fff;font-size:34px;font-weight:600;display:flex;align-items:center;justify-content:center}
.hdr h1{margin:0;font-size:20px}.hdr p{margin:2px 0 0;color:var(--hint);font-size:14px}
.sec{margin:16px 0 6px;padding:0 32px;font-size:13px;text-transform:uppercase;color:var(--hint)}
.card{background:var(--card);margin:0 16px;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;cursor:pointer;user-select:none}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row:active{background:var(--sep)}
.ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{color:var(--hint);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.val{color:var(--hint);font-size:15px}.blue{color:var(--link)}.red{color:var(--red)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sep);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:20px}
.note{padding:8px 32px;color:var(--hint);font-size:13px}
.big{text-align:center;padding:40px 24px 8px}
.code{font:700 40px ui-monospace,Menlo,monospace;letter-spacing:6px;margin:18px 0;padding:14px;background:var(--card);border-radius:14px;display:inline-block;cursor:pointer}
.btn{display:block;margin:16px;padding:14px;border-radius:12px;background:var(--btn);color:var(--btx);text-align:center;font-weight:500;cursor:pointer;border:0;width:calc(100% - 32px);font-size:16px}
.btn:active{opacity:.7}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;transition:.25s;z-index:9}
.toast.show{transform:translateX(-50%)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ====== SETTINGS: public HTTPS address of your bot API (see README) ======
const API_URL = "https://YOUR-API-ADDRESS";
const BOT_USERNAME = "FiveEnbot";
// =========================================================================
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const $ = document.getElementById("app");
const store = { get:k=>localStorage.getItem(k), set:(k,v)=>{localStorage.setItem(k,v); try{tg.CloudStorage.setItem(k,v)}catch(e){}}, del:k=>{localStorage.removeItem(k); try{tg.CloudStorage.removeItem(k)}catch(e){}} };
let token = store.get("5em_token"), me = null, view = "home", sel = -1, poller = null;
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hap = t => { try{tg.HapticFeedback.impactOccurred(t||"light")}catch(e){} };
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
async function api(path, opt={}){
  const r = await fetch(API_URL+path, {...opt, headers:{"Content-Type":"application/json", ...(token?{Authorization:"Bearer "+token}:{})}});
  if(r.status===401){ token=null; store.del("5em_token"); me=null; throw new Error("auth"); }
  return r.json();
}
const act = body => api("/tma/action",{method:"POST",body:JSON.stringify(body)});
async function copy(t){ try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()} hap(); toast("Скопійовано"); }
window.copy = copy;

// ---- link screen ----
async function showLink(){
  clearInterval(poller); view="link"; tg.BackButton.hide();
  $.innerHTML = `<div class="big"><div class="ava" style="width:96px;height:96px;font-size:40px">5</div><h1>5em</h1>
  <p style="color:var(--hint)">Прив'яжіть акаунт до Mini App.<br>Надішліть цей код боту:</p><div class="code" id="c">…</div>
  <p style="color:var(--hint)">Напишіть у чаті з ботом<br><b style="color:var(--tx)">/link <span id="c2"></span></b></p></div>
  <button class="btn" onclick="tg.openTelegramLink('https://t.me/${BOT_USERNAME}')">Відкрити бота</button>
  <div class="note" style="text-align:center">Це потрібно лише один раз — далі застосунок вас запам'ятає.</div>`;
  try{
    const r = await api("/tma/code",{method:"POST",body:JSON.stringify({initData:tg.initData})});
    if(!r.ok) throw 0;
    c.textContent = c2.textContent = r.code; c.onclick = ()=>copy("/link "+r.code);
    poller = setInterval(async()=>{
      const p = await api("/tma/poll?code="+r.code);
      if(p.linked){ clearInterval(poller); token=p.token; store.set("5em_token",token); hap("medium"); load(); }
      else if(!p.ok){ clearInterval(poller); showLink(); }
    },2000);
  }catch(e){ c.textContent="—"; toast("Немає зв'язку з API або відкрито не з Telegram"); }
}

// ---- data ----
async function load(){
  if(!token) return showLink();
  try{ me = await api("/tma/me"); }catch(e){ return e.message==="auth" ? showLink() : fail(); }
  render();
}
function fail(){ $.innerHTML=`<div class="big"><h1>Немає зв'язку</h1><p style="color:var(--hint)">Не вдалось дістатись до сервера.</p></div><button class="btn" onclick="load()">Спробувати знову</button>`; }
async function run(body, msg){
  const r = await act(body);
  if(r.ok){ me=r; hap(); if(msg) toast(msg); render(); } else { hap("heavy"); toast(({limit:"Ліміт ключів вичерпано",code_invalid:"Невірний код",code_exhausted:"Код вичерпано",code_already_used:"Код вже використано"})[r.error]||"Помилка"); }
  return r;
}

// ---- render ----
function render(){ clearInterval(poller); if(view==="key"&&me.keys[sel]) return renderKey(); view="home"; renderHome(); }
function renderHome(){
  tg.BackButton.hide();
  const ini=(me.name||"?")[0].toUpperCase();
  $.innerHTML = `<div class="hdr"><div class="ava">${esc(ini)}</div><h1>${esc(me.name)}</h1><p>${me.username?"@"+esc(me.username)+" · ":""}ID ${esc(me.id)}</p></div>
  <div class="sec">Ключі · ${me.keys.length}/${me.max_keys}</div>
  <div class="card">${me.keys.map((k,i)=>`<div class="row" onclick="openKey(${i})"><div class="ic" style="background:${k.enabled?"#34c759":"#8e8e93"}">🔑</div><div class="grow"><b>${esc(k.name)}</b><small>${esc(k.key)}</small></div><span class="val">${k.uses}</span><span class="val">›</span></div>`).join("")||`<div class="row" style="cursor:default"><span class="val">Ключів ще немає</span></div>`}
  <div class="row" onclick="addKey()"><div class="ic" style="background:#2481cc">＋</div><div class="grow blue"><b>Додати ключ</b></div></div></div>
  <div class="sec">Акаунт</div>
  <div class="card">
  <div class="row" onclick="redeem()"><div class="ic" style="background:#ff9500">🎟</div><div class="grow"><b>Ввести код</b></div><span class="val">›</span></div>
  <div class="row" onclick="copy('${esc(me.id)}')"><div class="ic" style="background:#5856d6">#</div><div class="grow"><b>Мій ID</b></div><span class="val">${esc(me.id)}</span></div>
  <div class="row"><div class="ic" style="background:#34aadc">@</div><div class="grow"><b>Email</b></div><span class="val">${esc(me.email||"—")}</span></div>
  <div class="row"><div class="ic" style="background:#30b0c7">🛡</div><div class="grow"><b>2FA</b></div><span class="val">${me.twofa?"Увімкнено":"Вимкнено"}</span></div></div>
  <div class="card" style="margin-top:20px"><div class="row" onclick="logout()"><div class="grow red" style="text-align:center"><b>Вийти з Mini App</b></div></div></div>`;
}
function openKey(i){ sel=i; view="key"; renderKey(); }
function renderKey(){
  const k=me.keys[sel];
  tg.BackButton.show(); tg.BackButton.offClick(back); tg.BackButton.onClick(back);
  const last = k.last_used ? new Date(k.last_used*1000).toLocaleString() : "—";
  $.innerHTML = `<div class="hdr"><div class="ava" style="font-size:38px">🔑</div><h1>${esc(k.name)}</h1><p>${k.enabled?"Активний":"Вимкнений"}</p></div>
  <div class="sec">Ключ</div><div class="card">
  <div class="row" onclick="copy('${esc(k.key)}')"><div class="grow"><small style="font-size:15px;color:var(--tx)">${esc(k.key)}</small></div><span class="blue">Копіювати</span></div>
  <div class="row" onclick="copy('${esc(k.link)}')"><div class="grow"><b>Посилання</b><small>${esc(k.link)}</small></div><span class="blue">Копіювати</span></div></div>
  <div class="sec">Налаштування</div><div class="card">
  <div class="row" onclick="run({op:'toggle',idx:sel})"><div class="grow"><b>Ключ увімкнено</b></div><div class="sw ${k.enabled?"on":""}"></div></div>
  <div class="row" onclick="run({op:'share',idx:sel})"><div class="grow"><b>Інші можуть використовувати</b></div><div class="sw ${k.shareable?"on":""}"></div></div>
  <div class="row" onclick="rename()"><div class="ic" style="background:#2481cc">✎</div><div class="grow"><b>Перейменувати</b></div><span class="val">›</span></div>
  <div class="row" onclick="replaceKey()"><div class="ic" style="background:#ff9500">↻</div><div class="grow"><b>Замінити ключ</b></div><span class="val">›</span></div></div>
  <div class="sec">Статистика</div><div class="card">
  <div class="row" style="cursor:default"><div class="grow"><b>Підключень</b></div><span class="val">${k.uses}</span></div>
  <div class="row" style="cursor:default"><div class="grow"><b>Останнє</b></div><span class="val">${esc(last)}</span></div></div>
  <div class="card" style="margin-top:20px"><div class="row" onclick="del()"><div class="grow red" style="text-align:center"><b>Видалити ключ</b></div></div></div>`;
}
function back(){ view="home"; render(); }
const ask=(title,cb,def)=>{ const v=prompt(title,def||""); if(v!==null&&v.trim()) cb(v.trim()); };
const confirmQ=(m,cb)=>{ try{tg.showConfirm(m,ok=>ok&&cb())}catch(e){confirm(m)&&cb()} };
const addKey=()=>run({op:"add"},"Ключ створено");
const rename=()=>ask("Нова назва",v=>run({op:"rename",idx:sel,value:v}),me.keys[sel].name);
const replaceKey=()=>confirmQ("Замінити ключ? Старий перестане працювати.",()=>run({op:"replace",idx:sel},"Ключ замінено"));
const del=()=>confirmQ("Видалити ключ?",async()=>{ const r=await run({op:"delete",idx:sel},"Видалено"); view="home"; render(); });
const redeem=()=>ask("Введіть код",v=>run({op:"redeem",value:v},"Код активовано"));
const logout=()=>confirmQ("Вийти? Потрібно буде прив'язати акаунт знову.",async()=>{ try{await act({op:"logout"})}catch(e){} token=null; store.del("5em_token"); showLink(); });

// restore session from Telegram CloudStorage if localStorage is empty
(function init(){
  if(token) return load();
  try{ tg.CloudStorage.getItem("5em_token",(e,v)=>{ if(v){token=v;localStorage.setItem("5em_token",v);} load(); }); }catch(e){ load(); }
})();
</script>
</body>
</html>
